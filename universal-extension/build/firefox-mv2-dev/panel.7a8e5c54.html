<!DOCTYPE html>
<html>

<head>
    <style>body {
  color: #fff;
  background-color: #282828;
  padding: 16px;
  font-family: system-ui, -apple-system, sans-serif;
}

.endpoint-list {
  margin: 16px 0;
}

.endpoint-item {
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  display: flex;
}

.endpoint-form {
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  display: flex;
}

button {
  padding: 4px 8px;
}

input {
  padding: 4px;
}

.status-indicator {
  border-radius: 50%;
  width: 8px;
  height: 8px;
  display: inline-block;
}

.status-connected {
  background: #4caf50;
}

.status-disconnected {
  background: #f44336;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  margin-bottom: 4px;
  display: block;
}

.checkbox-group {
  margin-bottom: 8px;
}

.checkbox-group-2 {
  margin-bottom: 6px;
}

input[type="number"], input[type="text"] {
  width: 200px;
  padding: 4px;
}

.settings-section {
  border: 1px solid #ccc;
  border-radius: 4px;
  margin-bottom: 16px;
  padding: 16px;
}

.settings-header {
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  justify-content: space-between;
  align-items: center;
  display: flex;
}

.settings-header h3 {
  margin: 0;
}

.settings-content {
  margin-top: 16px;
  display: none;
}

.settings-content.visible {
  display: block;
}

.chevron {
  width: 20px;
  height: 20px;
  transition: transform .3s;
}

.chevron.open {
  transform: rotate(180deg);
}

.quick-actions {
  gap: 8px;
  margin-bottom: 16px;
  display: flex;
}

.action-button {
  color: #fff;
  cursor: pointer;
  background-color: #4a4a4a;
  border: none;
  border-radius: 4px;
  padding: 8px 16px;
  transition: background-color .2s;
}

.action-button:hover {
  background-color: #5a5a5a;
}

.action-button.danger {
  background-color: #f44336;
}

.action-button.danger:hover {
  background-color: #d32f2f;
}

</style>
</head>

<body>
    <div class="settings-section">
        <h3>Quick Actions</h3>
        <div class="quick-actions">
            <button id="capture-screenshot" class="action-button">
                Capture Screenshot
            </button>
            <button id="wipe-logs" class="action-button danger">
                Wipe All Logs
            </button>
        </div>
        <div class="checkbox-group-2" style="align-items: center; margin-top: 10px; display: flex">
            <label>
                <input type="checkbox" id="allow-auto-paste">
                Allow Auto-paste to Cursor
            </label>
        </div>
    </div>

    <div class="settings-section">
        <h3>Screenshot Settings</h3>
        <div class="form-group">
            <label for="screenshot-path">Provide a directory to save screenshots to (by default screenshots will be
                saved to your downloads folder if no path is provided)</label>
            <input type="text" id="screenshot-path" placeholder="/path/to/screenshots">
        </div>
    </div>

    <div class="settings-section">
        <h3>Server Connection Settings</h3>
        <div class="form-group">
            <label for="server-host">Server Host</label>
            <input type="text" id="server-host" placeholder="localhost or IP address">
        </div>
        <div class="form-group">
            <label for="server-port">Server Port</label>
            <input type="number" id="server-port" min="1" max="65535" value="3025">
        </div>
        <div class="quick-actions">
            <button id="discover-server" class="action-button">
                Auto-Discover Server
            </button>
            <button id="test-connection" class="action-button">
                Test Connection
            </button>
        </div>
        <div id="connection-status" style="margin-top: 8px; display: none">
            <span id="status-icon" class="status-indicator"></span>
            <span id="status-text"></span>
        </div>
    </div>

    <div class="settings-section">
        <div class="settings-header" id="advanced-settings-header">
            <h3>Advanced Settings</h3>
            <svg class="chevron" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>

        <div class="settings-content" id="advanced-settings-content">
            <div class="form-group">
                <label for="log-limit">Log Limit (number of logs)</label>
                <input type="number" id="log-limit" min="1" value="50">
            </div>

            <div class="form-group">
                <label for="query-limit">Query Limit (characters)</label>
                <input type="number" id="query-limit" min="1" value="30000">
            </div>

            <div class="form-group">
                <label for="string-size-limit">String Size Limit (characters)</label>
                <input type="number" id="string-size-limit" min="1" value="500">
            </div>

            <div class="form-group">
                <label for="max-log-size">Max Log Size (characters)</label>
                <input type="number" id="max-log-size" min="1000" value="20000">
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="show-request-headers">
                    Include Request Headers
                </label>
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="show-response-headers">
                    Include Response Headers
                </label>
            </div>
        </div>
    </div>

    <script src="/panels.b432240d.js" defer=""></script>
</body>

</html>
