<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            padding: 16px;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #282828;
            color: #fff;
        }

        .panel-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .connection-banner {
            display: flex;
            flex-direction: column;
            padding: 8px 16px;
            border-radius: 4px;
            margin-bottom: 16px;
        }

        .connection-banner.connected {
            background-color: rgba(0, 128, 0, 0.2);
            border: 1px solid rgba(0, 128, 0, 0.5);
        }

        .connection-banner.disconnected {
            background-color: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-indicator.connected {
            background-color: #00c853;
        }

        .status-indicator.disconnected {
            background-color: #ff3d00;
        }

        .connection-actions {
            display: flex;
            gap: 8px;
        }

        .discovery-message {
            margin-top: 8px;
            font-size: 0.9em;
            font-style: italic;
        }

        .settings-section {
            margin-bottom: 24px;
            border: 1px solid #444;
            border-radius: 4px;
            overflow: hidden;
        }

        .settings-section h3 {
            margin: 0;
            padding: 12px 16px;
            background-color: #333;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .settings-content {
            padding: 16px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.9em;
        }

        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 8px;
            background-color: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
        }

        .checkbox-group {
            margin-bottom: 12px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            margin: 0;
        }

        .endpoint-form {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            align-items: center;
        }

        button {
            padding: 8px 12px;
            background-color: #2196f3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background-color: #1976d2;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .action-button {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
        }

        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 16px;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <!-- Use the React panel component -->
    <script src="./config.tsx" type="module"></script>
</body>

</html>
